<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEKE - [HYPER] Key Editor for Karabiner-Elements</title>
<link rel="stylesheet" href="./styles/variables.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/paste-view.css">
<link rel="stylesheet" href="./styles/editor-layout.css">
<link rel="stylesheet" href="./styles/sublayer-panel.css">
<link rel="stylesheet" href="./styles/key-grid.css">
<link rel="stylesheet" href="./styles/binding-panel.css">
<link rel="stylesheet" href="./styles/dialogs.css">
</head>
<body>

<div id="app">
  <!-- ========== Paste View ========== -->
  <div id="paste-view">
    <h1>[HYPER] Key Editor for Karabiner-Elements</h1>
    <p class="subtitle">Paste your karabiner.json or rules array, edit visually, copy the result.</p>
    <textarea id="json-input" placeholder='Paste your karabiner.json or complex_modifications rules array here...'></textarea>
    <div id="paste-error" class="error-msg"></div>
    <div id="paste-actions">
      <button class="btn-primary" id="btn-load">Load Configuration</button>
      <button class="btn-secondary" id="btn-new">New Configuration</button>
    </div>
  </div>

  <!-- ========== Editor View ========== -->
  <div id="editor-view" hidden>
    <header id="editor-header">
      <h1>Hyper Key Editor</h1>
      <div id="header-actions">
        <button class="btn-primary btn-sm" id="btn-copy">Copy JSON</button>
        <button class="btn-secondary btn-sm" id="btn-start-over">Start Over</button>
      </div>
    </header>

    <div id="editor-body">
      <aside id="sublayer-panel">
        <div id="sublayer-panel-header">Layers</div>
        <div id="sublayer-list"></div>
      </aside>

      <div id="main-panel">
        <div id="key-grid">
          <div id="key-grid-title">Key Bindings</div>
          <div id="key-grid-rows"></div>
        </div>

        <div id="binding-panel">
          <div id="binding-panel-header">
            <span id="binding-panel-title">Binding Editor</span>
            <button class="btn-danger btn-sm" id="btn-delete-binding" hidden>Delete</button>
          </div>
          <div id="binding-editor-content">
            <div id="binding-editor-placeholder" class="editor-placeholder">
              Select a binding from the tree to edit, or click a key in the grid to add one.
            </div>
            <div id="binding-form" hidden>
              <div class="form-row">
                <label>Key</label>
                <input id="bf-key" maxlength="1" placeholder="Key">
                <label>Type</label>
                <select id="bf-type">
                  <option value="app">Open App</option>
                  <option value="shell">Shell Command</option>
                  <option value="key">Key Combo</option>
                  <option value="layer">Activate Layer</option>
                </select>
              </div>
              <div class="form-row">
                <label id="bf-value-label">Value</label>
                <input id="bf-value" placeholder="App name, command, or key_code">
              </div>
              <div class="form-row" id="modifier-row" hidden>
                <label>Modifiers</label>
                <label><input type="checkbox" id="mod-cmd" value="left_command"> Cmd</label>
                <label><input type="checkbox" id="mod-ctrl" value="left_control"> Ctrl</label>
                <label><input type="checkbox" id="mod-opt" value="left_option"> Opt</label>
                <label><input type="checkbox" id="mod-shift" value="left_shift"> Shift</label>
              </div>
              <div id="bf-error" class="error-msg"></div>
              <div class="form-actions">
                <button class="btn-primary btn-sm" id="btn-save-binding">Save</button>
                <button class="btn-secondary btn-sm" id="btn-cancel-binding">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
